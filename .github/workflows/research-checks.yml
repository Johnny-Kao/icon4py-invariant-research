name: Research checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-common:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --frozen --package icon4py-atmosphere-dycore --no-dev --python 3.12
      - run: uv run --no-sync python research/check_ic01_ic03.py
      - run: uv run --no-sync python research/check_ic01_ape.py
