name: IC-06 and IC-08 native checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        backend: [embedded, gtfn_cpu]
    env:
      GT4PY_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --frozen --package icon4py-atmosphere-tracer-advection --no-dev --python 3.12
      - run: uv run --no-sync python research/check_ic06_ic08_transport.py --backend ${{ matrix.backend }}
