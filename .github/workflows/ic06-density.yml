name: IC-06 density floor
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --frozen --package icon4py-atmosphere-tracer-advection --no-dev --python 3.12
      - run: uv run --no-sync python research/check_ic06_density_floor.py
