name: IC-01 compiled interface differential
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}/bindings/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --frozen --package icon4py-atmosphere-dycore --package icon4py-tools --no-dev --python 3.12
      - name: Baseline compiled bridge
        run: uv run --no-sync python research/check_ic01_bridge.py old
      - name: Apply Python candidate
        run: git apply --check research/ic01_icon4py.patch && git apply research/ic01_icon4py.patch
      - name: Corrected compiled bridge
        run: uv run --no-sync python research/check_ic01_bridge.py fixed
  caller-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Check exact public ICON caller patch
        run: |
          d="$RUNNER_TEMP/icon-caller"
          mkdir -p "$d/src/atm_dyn_iconam"
          curl --fail --location --retry 2 --max-time 35 'https://gitlab.dkrz.de/icon/icon-model/-/raw/7de853356c97db40d9f57105c58e72c3bf822cb0/src/atm_dyn_iconam/mo_icon4py_interfaces.f90' -o "$d/src/atm_dyn_iconam/mo_icon4py_interfaces.f90"
          git -C "$d" apply --check "$GITHUB_WORKSPACE/research/ic01_icon.patch"
          git -C "$d" apply "$GITHUB_WORKSPACE/research/ic01_icon.patch"
          grep -n 'htop_moist_proc' "$d/src/atm_dyn_iconam/mo_icon4py_interfaces.f90"
          echo 'PASS: patch applies to pinned official ICON caller; full ICON build not executed'
